<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dinner">
<title>Dinner this week</title>
<link rel="icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div>
      <div class="week-label" id="weekLabel">Week of</div>
      <h1 class="title">Dinner this week <span class="sync idle" id="syncDot" aria-live="polite"></span></h1>
    </div>
    <button class="btn-quiet" id="btnSwap" type="button">Swap days</button>
  </div>
  <div class="budget" id="budgetBar">
    <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
    <div class="budget-text">
      <span id="budgetTotal">$0</span>
      <span class="budget-split" id="budgetSplit"></span>
      <button class="budget-target" id="btnBudget" type="button">of $250</button>
    </div>
  </div>
</header>

<main>
  <section class="view" id="viewPlan">
    <ol class="week" id="week"></ol>
    <p class="section-hint fine">Day prices are what each dinner uses. The list rounds up to whole packages.</p>

    <button class="weekly-toggle" id="weeklyToggle" type="button" aria-expanded="false" aria-controls="weeklyBody">
      <span class="chev" id="weeklyChevron">▸</span>
      <span class="weekly-title">Every week</span>
      <span class="weekly-summary" id="weeklySummary"></span>
    </button>
    <div id="weeklyBody" class="hidden">
      <p class="section-hint">Lunches, breakfasts, snacks, drinks. Set once, tweak when needed.</p>
      <div class="checklist" id="checklist"></div>
      <div class="row-actions"><button class="btn ghost" id="btnAddWeekly" type="button">Add an item</button></div>
    </div>

    <div class="plan-actions">
      <button class="btn" id="btnShare" type="button">Share plan</button>
      <button class="btn ghost" id="btnPast" type="button">Past weeks</button>
      <button class="btn ghost" id="btnNewWeek" type="button">Start a new week</button>
    </div>
  </section>

  <section class="view hidden" id="viewList">
    <div class="list-head">
      <h2 class="section-title">Shopping list</h2>
      <div class="list-actions">
        <button class="btn" id="btnNotes" type="button">Copy for Notes</button>
        <button class="btn" id="btnReminders" type="button">Copy for Reminders</button>
      </div>
      <p class="section-hint" id="listMeta"></p>
    </div>
    <div id="list"></div>
    <div class="spent">
      <label for="spentInput">What I actually spent</label>
      <div class="spent-row">
        <span class="spent-dollar">$</span>
        <input id="spentInput" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
      </div>
      <p class="section-hint" id="spentDiff"></p>
    </div>
  </section>

  <section class="view hidden" id="viewDeals">
    <h2 class="section-title">On sale this week</h2>
    <p class="section-hint" id="dealsMeta"></p>
    <div id="deals"></div>
  </section>
</main>

<nav class="tabs">
  <button class="tab active" data-view="viewPlan" type="button">Plan</button>
  <button class="tab" data-view="viewList" type="button">List</button>
  <button class="tab" data-view="viewDeals" type="button">Deals</button>
</nav>

<div class="sheet-backdrop hidden" id="backdrop"></div>
<section class="sheet hidden" id="sheet" aria-modal="true" role="dialog">
  <div class="sheet-top">
    <div class="sheet-handle"></div>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">Close</button>
  </div>
  <div id="sheetBody"></div>
</section>

<div class="toast hidden" id="toast"></div>

<script src="js/app.js?v=20"></script>
</body>
</html>
